name: IaC Security Scan - Snyk + Trivy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCAN_PATH: docs

jobs:
  iac_security_scan:
    runs-on: ubuntu-latest

    steps:

    #####################################################################
    # Step 1 - Checkout source code from GitHub repository
    #####################################################################
    - name: Checkout Repository
      uses: actions/checkout@v4

    #####################################################################
    # Step 2 - Create report folder
    #
    # All output reports will be stored here
    #####################################################################
    - name: Create Report Folder and List Docs files
      run: |
        mkdir -p reports
        ls -al reports
        echo "List Docs Folders"
        ls $SCAN_PATH -al 
        
    #####################################################################
    # Step 3 - Install NodeJS
    # Required because Snyk CLI is distributed through NPM
    #####################################################################
    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 22

    #####################################################################
    # Step 4 - Install Snyk CLI
    #
    # Snyk CLI is used for:
    # - IaC Scanning
    # - SCA Scanning
    # - SAST Scanning
    #
    # In this workflow we are only using:
    # snyk iac test
    #####################################################################
    - name: Install Snyk CLI
      run: |
        npm install -g snyk
        snyk --version
    #####################################################################
    # Step 5 - Run Snyk IaC Scan
    #
    # Command Explanation:
    #
    # snyk iac test
    #   => Performs Infrastructure as Code scan
    #
    # docs
    #   => Folder to scan
    #
    # --severity-threshold=high
    #   => Only High/Critical findings fail pipeline
    #
    # > reports/snyk-iac-report.txt
    #   => Store output in Text file
    #
    #####################################################################
    - name: Run Snyk IaC Scan
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      continue-on-error: true
      run: |
        echo "Snyk Version"
        snyk --version
        echo "Testing Authentication"
        snyk auth $SNYK_TOKEN
        echo "Testing Account Access"
        snyk whoami
        echo "============= SNYK IaC SCAN =============" > reports/snyk-iac-report.txt
        ls -la $SCAN_PATH
        # snyk iac test docs -d
        snyk iac test $SCAN_PATH  --severity-threshold=high >> reports/snyk-iac-report.txt 2>&1 || true
        # snyk monitor  => For Monitoring in Snyk Dashboard all vulnerabilties
    #===============================================================================================================
    # Step 6 - Install Trivy
    #
    # Trivy is an open-source scanner by Aqua Security
    #
    # It can scan:
    # - Containers
    # - Filesystems
    # - IaC
    # - Secrets
    #
    # trivy config docs
    #   => Scan Terraform / K8s / YAML / IaC files
    #
    # --severity HIGH,CRITICAL
    #   => Report only High & Critical findings
    #####################################################################
    - name: Install Trivy as CLI
      run: |
        sudo apt-get update
        sudo apt-get install wget -y
        wget https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.deb
        sudo dpkg -i trivy_0.76.0_Linux-64bit.deb
        trivy --version
        
    #####################################################################
    # Step 7 - Run Trivy IaC Scan
    - name: Run Trivy IaC Scan
      continue-on-error: true
      run: |
        echo "============= TRIVY IaC SCAN =============" > reports/trivy-iac-report.txt
   #     trivy config $SCAN_PATH --severity HIGH,CRITICAL >> reports/trivy-iac-report.txt 2>&1

    #####################################################################
    - name: Run Trivy using Docker
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace aquasec/trivy:latest config /workspace/docs --severity HIGH,CRITICAL > reports/trivy-iac-report.txt

    #####################################################################
    # Step 8 - Upload Snyk Report
    #####################################################################
    - name: Upload Snyk Report
      uses: actions/upload-artifact@v4
      with:
        name: snyk-iac-report
        path: reports/snyk-iac-report.txt

    #####################################################################
    # Step 9 - Upload Trivy Report
    #####################################################################
    - name: Upload Trivy Report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-iac-report
        path: reports/trivy-iac-report.txt

    #####################################################################
    # Step 10 - Upload Combined Reports
    #####################################################################
    - name: Upload All Reports
      uses: actions/upload-artifact@v4
      with:
        name: iac-security-reports
        path: reports/

    #####################################################################
    # Step 11 - Security Gate
    #
    # Pipeline will fail if Trivy OR Snyk detects
    # High / Critical findings.
    #####################################################################
    - name: Security Gate
      shell: bash
      run: |
        echo "=========================================================="
        echo "Starting Final Security Validation"
        echo "=========================================================="
        
        SNYK_RESULT=0
        TRIVY_RESULT=0
    
        echo ""
        echo "[INFO] Running Snyk IaC Scan..."
        snyk iac test $SCAN_PATH --severity-threshold=high || SNYK_RESULT=$?
    
        echo ""
        echo "[INFO] Running Trivy IaC Scan..."
        trivy config $SCAN_PATH --severity HIGH,CRITICAL --exit-code 1 || TRIVY_RESULT=$?
    
        echo ""
        echo "=========================================================="
        echo "Security Scan Results"
        echo "=========================================================="
        echo "Snyk Exit Code : $SNYK_RESULT"
        echo "Trivy Exit Code: $TRIVY_RESULT"
        echo "=========================================================="
    
        if [ "$SNYK_RESULT" -eq 0 ] && [ "$TRIVY_RESULT" -eq 0 ]; then
          echo ""
          echo "✅ SECURITY GATE PASSED"
          echo "✅ No HIGH or CRITICAL vulnerabilities detected."
          echo "✅ Code is allowed to proceed."
          echo ""
          exit 0
        fi
        echo ""
        echo "❌ SECURITY GATE FAILED"
        echo ""
    
        if [ "$SNYK_RESULT" -ne 0 ]; then
          echo "❌ Snyk detected HIGH/CRITICAL IaC findings OR encountered a scan error."
        fi
    
        if [ "$TRIVY_RESULT" -ne 0 ]; then
          echo "❌ Trivy detected HIGH/CRITICAL IaC findings."
        fi
    
        echo ""
        echo "❌ Build blocked due to security policy."
        echo "❌ Review scan reports uploaded as GitHub artifacts."
        echo ""
        exit 1
    
